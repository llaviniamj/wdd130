<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco | White Water Rafting</title>
    <meta name="description"
        content="Entre em contato com a White Water Rafting. Encontre nossa localização, envie suas dúvidas, sugestões ou faça perguntas sobre reservas.">
    <meta name="author" content="Lavínia Morais">
    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>

    <header>
        <img src="imagens/logo.png" alt="Logo White Water Rafting" class="logo">
        <nav>
            <a href="index.html">Página Inicial</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="passeios.html">Passeios</a>
            <a href="contato.html">Fale Conosco</a>
        </nav>
    </header>

    <main>
        <section class="empresa-info">
            <h1>White Water Rafting</h1>
            <p>Rodovia das Cataratas, BR-469, Km 18</p>
            <p>Foz do Iguaçu, Paraná</p>
            <p>+55 45 3521-4400</p>
            <p><a href="mailto:contato@whitewaterrafting.com">contato@whitewaterrafting.com</a></p>
        </section>

        <section class="conteudo-central">

            <div class="mapa-container">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d921354.8997731706!2d-54.80786551624637!3d-25.570250201867246!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1sParque%20Nacional%20do%20Igua%C3%A7u%2C%20Foz%20do%20Igua%C3%A7u.!5e0!3m2!1spt-BR!2sbr!4v1780780232581!5m2!1spt-BR!2sbr"
                    width="600" height="450" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <div class="formulario-container">
                <form action="#" method="POST">

                    <div class="form-grupo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite aqui" required>
                    </div>

                    <div class="form-grupo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="Digite aqui" required>
                    </div>

                    <div class="form-grupo-radio">
                        <span class="radio-titulo">Propósito da Mensagem</span>

                        <div class="radio-opcao">
                            <input type="radio" id="opcao-geral" name="proposito" value="geral" checked>
                            <label for="opcao-geral">Dúvida Geral</label>
                        </div>

                        <div class="radio-opcao">
                            <input type="radio" id="opcao-reserva" name="proposito" value="reserva">
                            <label for="opcao-reserva">Pergunta sobre Reserva</label>
                        </div>

                        <div class="radio-opcao">
                            <input type="radio" id="opcao-sugestao" name="proposito" value="sugestao">
                            <label for="opcao-sugestao">Sugestão</label>
                        </div>
                    </div>

                    <div class="form-grupo">
                        <label for="mensagem">Mensagem</label>
                        <textarea id="mensagem" name="mensagem" rows="5" placeholder="Digite aqui" required></textarea>
                    </div>

                    <div class="form-grupo-checkbox">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Por favor, me inscreva na newsletter mensal</label>
                    </div>

                    <button type="submit" class="btn-submit">Entrar em Contato</button>
                </form>
            </div>

        </section>

        <section class="secao-equipe">
            <h2>Estamos Aqui para Servi-lo</h2>
            <div class="equipe-grid">

                <figure class="perfil-card">
                    <img src="imagens/perfil1.jpg"
                        alt="Instrutor gritando comandos enquanto enfrenta uma forte corredeira.">
                    <figcaption>Carlos Silva – Guia de Expedição</figcaption>
                </figure>

                <figure class="perfil-card">
                    <img src="imagens/perfil2.jpg"
                        alt="Guia de aventura remando intensamente em meio a uma corredeira.">
                    <figcaption>Pedro Santos – Instrutor de Rafting Extremo</figcaption>
                </figure>

                <figure class="perfil-card">
                    <img src="imagens/perfil3.jpg" alt="Instrutora sorrindo e remando em águas turbulentas.">
                    <figcaption>Ana Oliveira – Coordenadora de Segurança</figcaption>
                </figure>

            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 White Water Rafting | Lavínia Morais</p>
        <nav class="redes-sociais">
            <a href="https://facebook.com" target="_blank">
                <img src="imagens/facebook.svg" alt="Facebook">
            </a>
            <a href="https://linkedin.com" target="_blank">
                <img src="imagens/linkedin.svg" alt="LinkedIn">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="imagens/instagram.svg" alt="Instagram">
            </a>
        </nav>
    </footer>

</body>

</html>
